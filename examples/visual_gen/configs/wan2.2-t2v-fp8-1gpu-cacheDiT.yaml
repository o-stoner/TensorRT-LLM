# 1-GPU Wan 2.2 T2V FP8 blockwise dynamic quantization + CacheDiT block-level caching.
# CacheDiT skips redundant transformer blocks when residual norms between
# denoising steps fall below residual_diff_threshold.
# Requires: pip install cache-dit
quant_config:
  quant_algo: FP8_BLOCK_SCALES
  dynamic: true
attention:
  backend: VANILLA
parallel:
  dit_cfg_size: 1
  dit_ulysses_size: 1
cuda_graph:
  enable_cuda_graph: false
cache:
  cache_backend: cache_dit
  residual_diff_threshold: 0.24
  max_continuous_cached_steps: 3
  max_warmup_steps: 4
